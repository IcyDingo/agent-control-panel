<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Glue's icon: the overseer's mark (a rounded square with a dot at its heart, .ov-mark in public/index.html) on a
       dark tile in macOS's icon grid (an 824 px plate, 100 px in from each edge). The mark keeps the page's proportions:
       a 22-unit square, 7-unit corners, a 6-unit dot. Colours are the page's dark theme tokens (fg, panel, bg). -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2027"/>
      <stop offset="1" stop-color="#0c0e11"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f7"/>
      <stop offset="1" stop-color="#d5dae1"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="292" y="292" width="440" height="440" rx="140" fill="url(#mark)"/>
  <circle cx="512" cy="512" r="120" fill="#14171c"/>
</svg>
