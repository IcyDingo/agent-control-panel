<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Agent Panel's icon: Space view in one frame. You at the centre, a satellite (a session) on its orbit asking you
       something (amber, with its tether), and Earth, where new agents launch from. Colours are the page's space tokens. -->
  <defs>
    <radialGradient id="space" cx="0.42" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#14294b"/>
      <stop offset="0.55" stop-color="#081224"/>
      <stop offset="1" stop-color="#03050a"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc46e" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffc46e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffc46e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.55" stop-color="#ffe9b8"/>
      <stop offset="1" stop-color="#f0c070"/>
    </radialGradient>
    <radialGradient id="earthGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#6ea0f0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6ea0f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earth" cx="0.4" cy="0.36" r="0.66">
      <stop offset="0" stop-color="#4c84c4"/>
      <stop offset="0.58" stop-color="#29507f"/>
      <stop offset="1" stop-color="#12233a"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4dcaa"/>
      <stop offset="0.42" stop-color="#e3ab3e"/>
      <stop offset="1" stop-color="#6e4f17"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="ball"><circle cx="296" cy="730" r="92"/></clipPath>
  </defs>

  <ellipse cx="512" cy="924" rx="400" ry="34" fill="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#space)"/>

  <g clip-path="url(#tile)">
    <g fill="#cfd8e6">
      <circle cx="214" cy="236" r="3.5" opacity="0.7"/>
      <circle cx="402" cy="168" r="2.5" opacity="0.5"/>
      <circle cx="846" cy="214" r="3" opacity="0.6"/>
      <circle cx="880" cy="566" r="2.5" opacity="0.45"/>
      <circle cx="610" cy="842" r="3" opacity="0.5"/>
      <circle cx="168" cy="480" r="2.5" opacity="0.4"/>
      <circle cx="770" cy="760" r="2" opacity="0.4"/>
    </g>

    <!-- orbits, tilted like Space view's -->
    <ellipse cx="512" cy="512" rx="196" ry="104" transform="rotate(-20 512 512)" fill="none" stroke="#94aacd" stroke-opacity="0.18" stroke-width="4"/>
    <ellipse cx="512" cy="512" rx="318" ry="168" transform="rotate(-20 512 512)" fill="none" stroke="#94aacd" stroke-opacity="0.34" stroke-width="5"/>

    <!-- you -->
    <circle cx="512" cy="512" r="200" fill="url(#sunGlow)"/>
    <circle cx="512" cy="512" r="58" fill="url(#sun)"/>

    <!-- the request's tether -->
    <line x1="548" y1="472" x2="676" y2="350" stroke="#e3ab3e" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>

    <!-- a session waiting on you: amber body between two solar wings, along its orbit -->
    <g transform="translate(704 327) rotate(12)">
      <rect x="-138" y="-27" width="86" height="54" fill="#15243b"/>
      <g fill="#345a91">
        <rect x="-138" y="-27" width="19" height="54"/><rect x="-116" y="-27" width="19" height="54"/><rect x="-94" y="-27" width="19" height="54"/><rect x="-72" y="-27" width="20" height="54"/>
        <rect x="52" y="-27" width="19" height="54"/><rect x="74" y="-27" width="19" height="54"/><rect x="96" y="-27" width="19" height="54"/><rect x="118" y="-27" width="20" height="54"/>
      </g>
      <rect x="-138" y="-27" width="86" height="54" fill="none" stroke="#96b9eb" stroke-opacity="0.45" stroke-width="2.5"/>
      <rect x="52" y="-27" width="86" height="54" fill="none" stroke="#96b9eb" stroke-opacity="0.45" stroke-width="2.5"/>
      <line x1="-52" y1="0" x2="-35" y2="0" stroke="#afc3e1" stroke-opacity="0.75" stroke-width="3"/>
      <line x1="35" y1="0" x2="52" y2="0" stroke="#afc3e1" stroke-opacity="0.75" stroke-width="3"/>
      <rect x="-35" y="-35" width="70" height="70" rx="4" fill="url(#core)"/>
      <rect x="-35" y="-35" width="70" height="70" rx="4" fill="none" stroke="#000" stroke-opacity="0.3" stroke-width="2.5"/>
    </g>

    <!-- Earth, where new agents launch from -->
    <circle cx="296" cy="730" r="128" fill="url(#earthGlow)"/>
    <circle cx="296" cy="730" r="92" fill="url(#earth)"/>
    <g clip-path="url(#ball)">
      <ellipse cx="250" cy="700" rx="40" ry="26" transform="rotate(-18 250 700)" fill="#5d8c60"/>
      <ellipse cx="300" cy="760" rx="24" ry="38" transform="rotate(-18 300 760)" fill="#527c55"/>
      <ellipse cx="356" cy="680" rx="30" ry="15" transform="rotate(-18 356 680)" fill="#69976a"/>
      <ellipse cx="370" cy="770" rx="18" ry="24" transform="rotate(-18 370 770)" fill="#4f7a52"/>
      <ellipse cx="270" cy="672" rx="34" ry="8" transform="rotate(-18 270 672)" fill="#fff" fill-opacity="0.45"/>
      <ellipse cx="330" cy="790" rx="42" ry="9" transform="rotate(-18 330 790)" fill="#fff" fill-opacity="0.38"/>
    </g>
  </g>

  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
