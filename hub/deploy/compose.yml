# The Universe hub on this server. Build: `docker compose build` (from the clone in ./src); run: `docker compose up -d`.
# Settings live in .env beside this file; the database in the hub-data volume.
services:
  hub:
    build:
      context: ./src
      dockerfile: hub/Dockerfile
    image: agent-hub
    container_name: agent-hub
    restart: unless-stopped
    # Locked down, since the hub shares this server with other sites: as the image's node user, a read-only filesystem
    # apart from the database volume and an in-memory /tmp, no Linux capabilities and no way to gain any, and a cap on
    # memory and processes.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    ports:
      - "127.0.0.1:4848:4848"
    volumes:
      - hub-data:/data
    env_file:
      - .env
      - path: release.env
        required: false
volumes:
  hub-data:
