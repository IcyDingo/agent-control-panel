# How the Linux app is packaged: an AppImage and a .deb from the same files. `npm run dist:linux` builds both for the
# machine's architecture; .github/workflows/release.yml builds x64 and arm64. The Mac app is not built here
# (app/build.sh makes it).
appId: local.glue
productName: Glue
executableName: glue
directories:
  output: dist

# Not packed into an archive: python3 reads the helper scripts as files, and the layout is the checkout's, so
# desktop/main.mjs finds server.mjs the same way installed as it does from the repo.
asar: false
files:
  - "*.mjs"
  - "*.py"
  - hooks.example.json
  - LICENSE
  - public/**
  - desktop/**
  - app/icons/**
electronLanguages: [en-US]
npmRebuild: false # nothing here is compiled

toolsets:
  # The AppImage runtime that needs no libfuse2 on the user's machine (Ubuntu 24.04 and Fedora no longer install it).
  appimage: "1.0.3"

linux:
  target: [AppImage, deb]
  category: Development
  icon: app/icons
  synopsis: Every Claude Code session on this computer, in one window
  # One name per architecture, with no version in it: an update replaces the AppImage where it is, so launchers and
  # the start-at-login entry keep pointing at it.
  artifactName: Glue-${arch}.${ext}
  # The installed entry is glue.desktop (package.json's desktopName), which is what the window and its badge go by.
  syncDesktopName: true

  packageCategory: devel

deb:
  # What Electron links against (electron-builder's own list, plus libgbm1 and libasound2, which it loads at start),
  # and python3 for the helpers that work a background session's terminal. Setting this replaces the default list,
  # so it is spelled out. Ubuntu 24.04's renamed packages (libgtk-3-0t64 and the like) provide these names.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    # Named both ways on purpose. On Ubuntu 24.04 plain "libasound2" is only a virtual name, and apt may satisfy it
    # with liboss4-salsa-asound2, which lacks symbols Electron needs: the app then fails to start.
    - libasound2t64 | libasound2
    - python3
  recommends: [libappindicator3-1, libnotify-bin]

# Where the app looks for a newer version (electron-updater). Releases are drafted by CI and published by a person;
# nothing is uploaded from here (the build runs with --publish never).
publish:
  provider: github
  owner: IcyDingo
  repo: agent-control-panel
